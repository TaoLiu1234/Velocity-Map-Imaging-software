name: CI Debug

on:
  push:
    branches: [main]

jobs:
  probe:
    name: matplotlib text-render hang isolation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 fonts-dejavu-core xvfb
          sudo apt-get install -y libglib2.0-0 || sudo apt-get install -y libglib2.0-0t64
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyarrow
      - name: "A - pure matplotlib text render (no app, no Qt)"
        timeout-minutes: 2
        continue-on-error: true
        run: |
          cat > /tmp/a.py << 'PYEOF'
          import time, matplotlib
          matplotlib.use("Agg")
          print("mpl", matplotlib.__version__, flush=True)
          t0 = time.time()
          import matplotlib.figure
          f = matplotlib.figure.Figure(figsize=(6, 4))
          f.text(0.1, 0.1, "hello title")
          ax = f.add_subplot(111)
          ax.set_title("panel title")
          f.savefig("/tmp/a.png", dpi=72)
          print(f"A-OK text render {time.time()-t0:.1f}s", flush=True)
          PYEOF
          python -u /tmp/a.py
      - name: "B - font cache prebuild timing"
        timeout-minutes: 3
        continue-on-error: true
        run: |
          cat > /tmp/b.py << 'PYEOF'
          import time
          t0 = time.time()
          import matplotlib.font_manager as fm
          print(f"B fonts known: {len(fm.fontManager.ttflist)} in {time.time()-t0:.1f}s", flush=True)
          t0 = time.time()
          f = fm.findfont("DejaVu Sans")
          print(f"B findfont -> {f} in {time.time()-t0:.1f}s", flush=True)
          PYEOF
          python -u /tmp/b.py
      - name: "C - offscreen app probe after cache prebuild"
        timeout-minutes: 4
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -u -c "import matplotlib.font_manager; print('cache prebuilt', flush=True)"
          cat > /tmp/c.py << 'PYEOF'
          import time
          def m(t): print(f"C {t} t={time.time():.0f}", flush=True)
          from PySide6 import QtWidgets
          app = QtWidgets.QApplication([])
          m("qapp")
          import VMI_workflow as vw
          win = vw.MainWindow()
          m("constructed")
          win.figure.savefig("/tmp/fig.png", dpi=50)
          m("savefig-ok")
          win.show()
          app.processEvents()
          m("shown")
          PYEOF
          python -u /tmp/c.py
      - name: "D - xvfb app probe (script file, xcb)"
        timeout-minutes: 5
        continue-on-error: true
        run: |
          cat > /tmp/d.py << 'PYEOF'
          import time
          def m(t): print(f"D {t} t={time.time():.0f}", flush=True)
          from PySide6 import QtWidgets
          app = QtWidgets.QApplication([])
          m("qapp")
          import VMI_workflow as vw
          win = vw.MainWindow()
          m("constructed")
          win.show()
          app.processEvents()
          m("shown")
          PYEOF
          xvfb-run -a python -u /tmp/d.py
