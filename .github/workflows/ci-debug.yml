name: CI Debug

on:
  push:
    branches: [main]

jobs:
  pinned-smoke:
    name: full smoke with PySide6 pinned to 6.11.1 (offscreen)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 fonts-dejavu-core
          sudo apt-get install -y libglib2.0-0 || sudo apt-get install -y libglib2.0-0t64
      - name: Install Python dependencies (PySide6 pinned to the locally tested version)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyarrow "PySide6==6.11.1"
          python -c "import PySide6; print('PySide6', PySide6.__version__, flush=True)"
      - name: Generate deterministic sample data
        run: python tests/make_sample_data.py
      - name: Core numerics golden tests
        run: python -m pytest tests/test_core.py -q
      - name: Offscreen smoke (pinned PySide6)
        run: QT_QPA_PLATFORM=offscreen python -u tests/test_smoke.py
        timeout-minutes: 25
