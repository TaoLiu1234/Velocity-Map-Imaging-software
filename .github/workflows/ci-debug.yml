name: CI Debug

on:
  push:
    branches: [main]

jobs:
  probe:
    name: offscreen hang pinpoint + xvfb fallback test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system libraries (incl. xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 fonts-dejavu-core xvfb
          sudo apt-get install -y libglib2.0-0 || sudo apt-get install -y libglib2.0-0t64
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyarrow
      - name: Fine-grained offscreen probe
        timeout-minutes: 3
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -u - << 'PYEOF'
          import time
          def m(tag): print(f"MILESTONE {tag} t={time.time():.0f}", flush=True)
          from PySide6 import QtWidgets, QtCore
          app = QtWidgets.QApplication([])
          m("qapp")
          plain = QtWidgets.QWidget(); plain.resize(400, 300); plain.show()
          app.processEvents()
          m("plain-widget-shown")
          import VMI_workflow as vw
          win = vw.MainWindow()
          m("constructed")
          win.figure.savefig("/tmp/fig.png", dpi=50)
          m("figure-savefig-render")
          win.show()
          m("win-show-returned")
          deadline = time.time() + 20
          while time.time() < deadline:
              app.processEvents(); time.sleep(0.02)
          m("20s-processevents-survived")
          PYEOF
      - name: xvfb-run probe (same milestones, xcb platform)
        timeout-minutes: 6
        continue-on-error: true
        run: |
          xvfb-run -a python -u - << 'PYEOF'
          import time
          def m(tag): print(f"XVFB MILESTONE {tag} t={time.time():.0f}", flush=True)
          from PySide6 import QtWidgets
          app = QtWidgets.QApplication([])
          m("qapp")
          import VMI_workflow as vw
          win = vw.MainWindow()
          m("constructed")
          win.show()
          m("shown")
          deadline = time.time() + 60
          while time.time() < deadline:
              app.processEvents(); time.sleep(0.02)
          m("60s-processevents-survived")
          import os, sys, subprocess
          os.makedirs("tests/sample_data", exist_ok=True)
          subprocess.run([sys.executable, "tests/make_sample_data.py"], check=True)
          m("sample-data")
          S = "tests/sample_data/"
          win.file_paths["trigger"] = S + "synth_ar100_vmi_DAn.dat"
          win.file_paths["electron"] = S + "synth_ar100_vmi.lmf_elec_DAn.dat"
          win.file_paths["ion"] = S + "synth_ar100_vmi.lmf_ion_DAn.dat"
          win.load_cache()
          deadline = time.time() + 120
          while time.time() < deadline:
              app.processEvents()
              if win.cache is not None and not getattr(win, "_load_busy", False):
                  break
              time.sleep(0.05)
          m(f"cache-ready={win.cache is not None}")
          win.trigger_mode_combo.setCurrentIndex(win.trigger_mode_combo.findData("coincidence"))
          app.processEvents()
          win.process_and_plot()
          app.processEvents()
          m("process_and_plot-returned")
          print("XVFB PROBE COMPLETE", flush=True)
          PYEOF
