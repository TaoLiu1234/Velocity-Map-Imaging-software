# Continuous integration for VMI_workflow.
#
# Two jobs:
# 1. ubuntu-latest: the full suite (core numerics + offscreen end-to-end smoke test).
# 2. windows-latest: the core numerics suite only. Windows CI runners have no
#    display either; offscreen Qt works there but is historically flakier, so the
#    Windows job stays lean and exercises the Qt-free numerics contract.
#
# Sample data: `tests/sample_data/` is gitignored (large .dat files), so CI
# regenerates it deterministically (fixed RNG seed) with tests/make_sample_data.py.
# Both test suites also auto-regenerate it if missing; the explicit step just
# fails fast if generation breaks.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests-ubuntu:
    name: tests (ubuntu-latest, Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Qt (PySide6) needs these system libraries even for the offscreen platform.
      # libglib2.0-0 is named libglib2.0-0t64 on newer Ubuntu runners; try both.
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 fonts-dejavu-core xvfb
          # Full xcb set for the PySide6 wheel's xcb plugin under xvfb
          # (libxkbcommon-x11-0 is the classic missing piece).
          sudo apt-get install -y libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xkb1
          sudo apt-get install -y libglib2.0-0 || sudo apt-get install -y libglib2.0-0t64

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # Pin the CI environment to the exact dependency stack the suites
          # are verified against locally (two environments). Unpinned installs
          # resolve to newer releases (PySide6 6.11.2, matplotlib 3.11,
          # numpy 2.5) whose offscreen Qt path deadlocked the GUI smoke on
          # this runner image.
          pip install -r requirements.txt pyarrow pytest numpy==2.2.6 scipy==1.16.2 matplotlib==3.10.7 PySide6==6.11.1 shiboken6==6.11.1 pyabel==0.9.1 pyarrow==25.0.1 pillow==11.2.1 contourpy==1.3.3 kiwisolver==1.4.9 fonttools==4.60.1 cycler==0.12.1 pyparsing==3.2.3 python-dateutil==2.9.0.post0 packaging==24.2 six==1.17.0

      - name: Generate deterministic sample data
        run: python tests/make_sample_data.py

      - name: Core numerics golden tests
        run: python -m pytest tests/test_core.py -q

      # The GUI smoke runs under xvfb (real xcb platform, virtual display).
      # The offscreen platform deadlocks nondeterministically in the first
      # render on this runner image (hang point drifted between first show
      # and first figure render; reproducible with the exact locally green
      # dependency pins, so it is environmental, not version drift).
      - name: End-to-end smoke test (xvfb)
        run: xvfb-run -a python -u tests/test_smoke.py
        timeout-minutes: 30

  tests-windows-core:
    name: tests-core (windows-latest, Python 3.12)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest numpy==2.2.6 scipy==1.16.2 matplotlib==3.10.7 PySide6==6.11.1 shiboken6==6.11.1 pyabel==0.9.1 pyarrow==25.0.1 pillow==11.2.1 contourpy==1.3.3 kiwisolver==1.4.9 fonttools==4.60.1 cycler==0.12.1 pyparsing==3.2.3 python-dateutil==2.9.0.post0 packaging==24.2 six==1.17.0

      # Core suite only: Qt-free numerics; sample data is auto-generated if missing.
      - name: Core numerics golden tests
        run: python -m pytest tests/test_core.py -q
